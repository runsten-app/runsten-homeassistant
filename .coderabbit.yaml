# CodeRabbit's configuration: https://docs.coderabbit.ai/reference/configuration
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false

  # What the review posts: a summary and the walkthrough, nothing decorative.
  high_level_summary: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: false
  suggested_reviewers: false
  poem: false
  in_progress_fortune: false
  review_status: true

  auto_review:
    enabled: true
    drafts: false

  # Nothing is written to a branch by CodeRabbit: the maintainer commits.
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false

  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: warning
      requirements: "Short, imperative, in English (\"Add …\", \"Fix …\"), describing what the change does for the user or the code."
    description:
      mode: warning
    issue_assessment:
      mode: warning

  path_instructions:
    - path: "custom_components/runsten/**"
      instructions: "Current Home Assistant idioms (async only, no blocking I/O in the event loop, entry.runtime_data, OptionsFlowWithReload, sections). Entities mirror the core's MQTT discovery: same names, device classes and units. Unknown is None, never a zero or an off. The VIN is never shown, logged or stored. Nothing polls faster than one request a minute per account."
    - path: "custom_components/runsten/translations/**"
      instructions: "English, French, Swedish, Spanish, German and Norwegian (Bokmål) together, with the same keys; no URL in a string (a placeholder instead)."
    - path: "tests/**"
      instructions: "pytest-homeassistant-custom-component, the API mocked with aioclient_mock: no real network call."

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
